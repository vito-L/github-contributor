name: Text to Heatmap

on:
  workflow_dispatch:
    inputs:
      text:
        description: '要显示的文字（A-Z, 0-9, 空格）'
        required: true
        default: 'HELLO'
      year:
        description: '目标年份'
        required: true
        default: '2024'
      level:
        description: '贡献级别（1-4，越高越深）'
        required: false
        default: '4'

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate heatmap
        run: |
          # 获取输入
          TEXT=$(echo "${{ github.event.inputs.text }}" | tr '[:lower:]' '[:upper:]')
          YEAR="${{ github.event.inputs.year }}"
          LEVEL="${{ github.event.inputs.level || '4' }}"
          
          # 验证年份
          CURRENT_YEAR=$(date +%Y)
          if [ "$YEAR" -lt 2008 ] || [ "$YEAR" -gt "$CURRENT_YEAR" ]; then
            echo "Error: Year must be between 2008 and $CURRENT_YEAR"
            exit 1
          fi
          
          # 验证级别
          if [ "$LEVEL" -lt 1 ] || [ "$LEVEL" -gt 4 ]; then
            LEVEL=4
          fi
          
          # 根据级别确定提交次数
          case $LEVEL in
            1) COMMITS=1 ;;
            2) COMMITS=4 ;;
            3) COMMITS=7 ;;
            4) COMMITS=10 ;;
          esac
          
          # 读取字体配置
          FONT_JSON=$(cat fonts.json)
          
          # 计算文字总宽度
          WIDTH=0
          for (( i=0; i<${#TEXT}; i++ )); do
            CHAR="${TEXT:$i:1}"
            if [ "$CHAR" = " " ]; then
              WIDTH=$((WIDTH + 2))
            else
              CHAR_WIDTH=$(echo "$FONT_JSON" | jq -r ".$CHAR[0]" | wc -c)
              CHAR_WIDTH=$((CHAR_WIDTH - 1))
              WIDTH=$((WIDTH + CHAR_WIDTH + 1))
            fi
          done
          
          # 检查宽度是否超过52列
          if [ "$WIDTH" -gt 52 ]; then
            echo "Error: Text too wide ($WIDTH columns, max 52)"
            exit 1
          fi
          
          # 计算起始列（居中）
          START_COL=$(( (52 - WIDTH) / 2 ))
          
          # 配置 git
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          
          # 获取该年份的第一天是星期几
          FIRST_DAY=$(date -d "${YEAR}-01-01" +%u)
          # 调整为周日=0, 周一=1, ...
          FIRST_DAY=$(( (FIRST_DAY % 7) ))
          
          # 生成每一天的提交
          COL=$START_COL
          for (( i=0; i<${#TEXT}; i++ )); do
            CHAR="${TEXT:$i:1}"
            
            if [ "$CHAR" = " " ]; then
              COL=$((COL + 2))
              continue
            fi
            
            # 获取字符的像素数据
            PIXELS=$(echo "$FONT_JSON" | jq -r ".$CHAR // empty")
            if [ -z "$PIXELS" ]; then
              COL=$((COL + 5))
              continue
            fi
            
            # 获取字符宽度
            CHAR_WIDTH=$(echo "$PIXELS" | head -1 | wc -c)
            CHAR_WIDTH=$((CHAR_WIDTH - 1))
            
            # 遍历字符的每一行（行=星期几）
            for ROW in $(seq 0 6); do
              LINE=$(echo "$PIXELS" | sed -n "$((ROW+1))p")
              
              # 遍历字符的每一列
              for CHAR_COL in $(seq 0 $((CHAR_WIDTH-1))); do
                PIXEL="${LINE:$CHAR_COL:1}"
                
                if [ "$PIXEL" = "#" ]; then
                  # 计算这是该年的第几周
                  WEEK=$((COL + CHAR_COL))
                  
                  # 计算具体日期
                  # 该年的第1天 + 周数*7 + 星期几
                  DAY_OFFSET=$((WEEK * 7 + ROW - FIRST_DAY))
                  
                  if [ "$DAY_OFFSET" -ge 0 ] && [ "$DAY_OFFSET" -lt 365 ]; then
                    TARGET_DATE=$(date -d "${YEAR}-01-01 +${DAY_OFFSET} days" '+%Y-%m-%d')
                    
                    # 检查文件是否已存在
                    if [ ! -f "contributions/${TARGET_DATE}.txt" ]; then
                      # 生成随机时间
                      HOUR=$(shuf -i 0-23 -n 1)
                      MINUTE=$(shuf -i 0-59 -n 1)
                      
                      # 设置提交时间
                      export GIT_AUTHOR_DATE="${TARGET_DATE}T${HOUR}:${MINUTE}:00"
                      export GIT_COMMITTER_DATE="${TARGET_DATE}T${HOUR}:${MINUTE}:00"
                      
                      # 生成多次提交（控制颜色深度）
                      for (( c=0; c<COMMITS; c++ )); do
                        echo "Contribution on ${TARGET_DATE}" >> contributions/${TARGET_DATE}.txt
                        git add .
                        git commit -m "feat: contribution ${TARGET_DATE}" --allow-empty
                      done
                    fi
                  fi
                fi
              done
            done
            
            # 移动到下一个字符位置
            COL=$((COL + CHAR_WIDTH + 1))
          done
          
          # 推送
          git push
          
          echo "Done! Check your contribution graph for year $YEAR"
