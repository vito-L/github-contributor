name: Clean Year

on:
  workflow_dispatch:
    inputs:
      year:
        description: '要清除的年份'
        required: true
        default: '2024'

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean year history
        run: |
          YEAR="${{ github.event.inputs.year }}"
          
          echo "Cleaning year $YEAR..."
          
          # 配置 git
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          
          # 删除该年份的贡献文件
          rm -f contributions/${YEAR}-*.txt
          git add -A
          git commit -m "chore: remove year $YEAR contributions" || echo "No files to remove"
          
          # 使用 Python 脚本重写历史
          python3 -c "
          import subprocess
          import sys
          
          year = '$YEAR'
          
          # 获取所有 commit
          result = subprocess.run(['git', 'log', '--format=%H %aI', '--reverse'], capture_output=True, text=True)
          commits = result.stdout.strip().split('\n')
          
          # 找出需要保留的 commit
          keep = []
          for line in commits:
              if not line.strip():
                  continue
              hash, date = line.split(' ', 1)
              if not date.startswith(year + '-'):
                  keep.append(hash)
          
          if not keep:
              print('No commits to keep')
              sys.exit(0)
          
          # 创建新的历史
          last = keep[-1]
          subprocess.run(['git', 'reset', '--hard', last], check=True)
          "
          
          # 强制推送
          git push --force --all
          
          echo "Year $YEAR cleaned!"
