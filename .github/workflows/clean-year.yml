name: Clean Year

on:
  workflow_dispatch:
    inputs:
      year:
        description: '要清除的年份'
        required: true
        default: '2024'

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean year history
        run: |
          YEAR="${{ github.event.inputs.year }}"
          
          echo "Cleaning year $YEAR..."
          
          # 配置 git
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          
          # 获取所有 commit（按时间正序）
          COMMITS=$(git log --format="%H %aI" --reverse)
          
          # 找出需要保留的 commit（不是指定年份的）
          KEEP_COMMITS=""
          while IFS= read -r line; do
            if [ -z "$line" ]; then
              continue
            fi
            HASH=$(echo "$line" | cut -d' ' -f1)
            DATE=$(echo "$line" | cut -d' ' -f2)
            # 保留不是指定年份的 commit
            if ! echo "$DATE" | grep -q "^${YEAR}-"; then
              KEEP_COMMITS="$KEEP_COMMITS $HASH"
            fi
          done <<< "$COMMITS"
          
          if [ -z "$KEEP_COMMITS" ]; then
            echo "No commits to keep"
            exit 0
          fi
          
          # 获取最后一个需要保留的 commit
          LAST_KEEP=$(echo "$KEEP_COMMITS" | awk '{print $NF}')
          echo "Last keep commit: $LAST_KEEP"
          
          # 重置到该 commit
          git reset --hard "$LAST_KEEP"
          
          # 强制推送
          git push --force --all
          
          echo "Year $YEAR cleaned!"
