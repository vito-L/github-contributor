name: Clean Year

on:
  workflow_dispatch:
    inputs:
      year:
        description: '要清除的年份'
        required: true
        default: '2024'

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean year history
        run: |
          YEAR="${{ github.event.inputs.year }}"
          
          echo "Cleaning year $YEAR..."
          
          # 配置 git
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          
          # 删除该年份的贡献文件
          rm -f contributions/${YEAR}-*.txt
          git add -A
          git commit -m "chore: remove year $YEAR contributions" || echo "No files to remove"
          
          # 获取所有 commit
          COMMITS=$(git log --format="%H %aI" --reverse)
          
          # 找出需要删除的 commit
          DELETE_COMMITS=""
          while IFS= read -r line; do
            if [ -z "$line" ]; then
              continue
            fi
            HASH=$(echo "$line" | cut -d' ' -f1)
            DATE=$(echo "$line" | cut -d' ' -f2)
            if echo "$DATE" | grep -q "^${YEAR}-"; then
              DELETE_COMMITS="$DELETE_COMMITS $HASH"
            fi
          done <<< "$COMMITS"
          
          # 使用 git rebase 删除 commit
          if [ -n "$DELETE_COMMITS" ]; then
            echo "Deleting commits: $DELETE_COMMITS"
            for COMMIT in $DELETE_COMMITS; do
              git rebase --onto "$COMMIT^" "$COMMIT" || true
            done
          fi
          
          # 强制推送
          git push --force --all
          
          echo "Year $YEAR cleaned!"
