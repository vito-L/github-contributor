name: Daily Commit

on:
  schedule:
    # 每天 UTC 0-23 随机触发（通过多个 cron 实现）
    - cron: '0 1 * * *'
    - cron: '0 5 * * *'
    - cron: '0 9 * * *'
    - cron: '0 13 * * *'
    - cron: '0 17 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:  # 支持手动触发

jobs:
  commit:
    runs-on: ubuntu-latest
    # 只在随机选择的时间执行
    if: ${{ github.event_name == 'workflow_dispatch' || (hashFiles('contributions/*.txt') == '' || !contains(hashFiles('contributions/*.txt'), github.run_id)) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Random delay
        run: |
          # 随机延迟 0-3600 秒（1小时内）
          DELAY=$((RANDOM % 3601))
          echo "Waiting ${DELAY} seconds..."
          sleep ${DELAY}

      - name: Make commit
        run: |
          # 生成今天的日期文件
          TODAY=$(date '+%Y-%m-%d')
          NOW=$(date '+%H:%M:%S')
          
          # 检查今天是否已经提交
          if [ -f "contributions/${TODAY}.txt" ]; then
            echo "Already committed today, skipping..."
            exit 0
          fi
          
          # 读取配置
          if [ -f "config.json" ]; then
            # 获取随机模板
            TEMPLATES=$(cat config.json | jq -r '.content_templates[]')
            TEMPLATE=$(echo "$TEMPLATES" | shuf -n 1)
            
            # 替换变量
            CONTENT=$(echo "$TEMPLATE" | sed "s/{date}/$TODAY/g" | sed "s/{time}/$NOW/g")
            
            # 获取提交信息模板
            COMMIT_MSG=$(cat config.json | jq -r '.commit_message' | sed "s/{date}/$TODAY/g")
          else
            CONTENT="Contribution on ${TODAY} ${NOW}"
            COMMIT_MSG="feat: contribution ${TODAY}"
          fi
          
          # 创建文件
          echo "$CONTENT" >> contributions/${TODAY}.txt
          
          # 配置 git
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          
          # 提交
          git add .
          git commit -m "$COMMIT_MSG"
          git push
